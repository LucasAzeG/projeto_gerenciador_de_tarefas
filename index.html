<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="/css/style_gerenciadordetarefas.css">
    <script src="/js/script_gerenciadordetarefas.js" defer></script>
</head>
<body>
    <main id="geral">
        <header id="cabecalho">
            <div id="logo">
                <h3>Gerenciador de Tarefas</h3>
            </div>
        </header>

        <section id="container-principal">
            <div id="div-form">
                <form name="form" id="form" method="post">
                    <input type="text" name="tarefa" id="tarefa" class="input-vlr01" maxlength="30" required placeholder="Tarefa">

                    <input type="text" name="responsavel" id="responsavel" class="input-vlr01" maxlength="30" required placeholder="Responsável">

                    <textarea name="descricao" id="descricao" class="input-vlr02" maxlength="300" required placeholder="Descrição"></textarea>

                    <p>Prioridade</p>
                    <div class="div-prioridade">
                        <input type="radio" id="baixa" name="prioridade" value="baixa">
                        <label for="baixa">Baixa</label>

                        <input type="radio" id="media" name="prioridade" value="media">
                        <label for="media">Média</label>

                        <input type="radio" id="alta" name="prioridade" value="alta">
                        <label for="alta">Alta</label>
                    </div>

                    <label for="datatarefa">Data Tarefa</label>
                    <input type="date" name="datatarefa" id="datatarefa" class="input-vlr03" required>
                    
                    <div id="div-btns">
                        <button type="button" id="btn-adicionar">Adicionar Tarefa</button>
                        <button type="reset" id="btn-limpar">Limpar</button>
                    </div>
                </form>
            </div>

            <!-- CONTADORES DE STATUS (QUADROS AZUIS Á DIREITA) -->
            <div id="div-status">
                <div class="card-status">
                    <h3>Em aberto: <span id="qtd-aberto">0</span></h3>
                </div>
                  
                <div class="card-status">
                    <h3>Em andamento: <span id="qtd-andamento">0</span></h3>
                </div>
                  
                <div class="card-status">
                    <h3>Finalizada: <span id="qtd-finalizada">0</span></h3>
                </div>
            </div>
        </section>

        <!-- ÁREA INFERIOR DE PRIORIDADES E CARDS KANBAN -->
        <div id="div-prioridade-baixo">
        
            <!-- QUADRADOS COLORIDOS DE PRIORIDADE COM CONTADOR -->
            <div id="quadrados_urgencia">
                <div class="card-prio baixa">
                    <h3>BAIXA: <span id="qtd-baixa">0</span></h3>
                </div>
                <div class="card-prio media">
                    <h3>MÉDIA: <span id="qtd-media">0</span></h3>
                </div>
                <div class="card-prio alta">
                    <h3>ALTA: <span id="qtd-alta">0</span></h3>
                </div>
            </div>

            <!-- ÁREA KANBAN: JUNTA O TÍTULO E OS CARDS DA MESMA COLUNA -->
            <div id="area-kanban">
                <!-- COLUNA 1: ABERTO -->
                <div class="coluna-kanban">
                    <span class="rotulo-status">ABERTO</span>
                    <div id="coluna-aberto" class="lista-cards"></div>
                </div>

                <!-- COLUNA 2: EM ANDAMENTO -->
                <div class="coluna-kanban">
                    <span class="rotulo-status">EM ANDAMENTO</span>
                    <div id="coluna-andamento" class="lista-cards"></div>
                </div>

                <!-- COLUNA 3: FINALIZADA -->
                <div class="coluna-kanban">
                    <span class="rotulo-status">FINALIZADA</span>
                    <div id="coluna-finalizada" class="lista-cards"></div>
                </div>
            </div>

        </div>

    </main> 
</body>
</html>
