<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="/css/style_gerenciadordetarefas.css">

</head>
<body>
    <main id="geral">
        <header id="cabecalho">
            <div id="logo">
               <h3>Gerenciador de Tarefas</h3>
            </div>
        </header>

        <section id="div-form">
            <div class="card">
                <form name="form" id="form" method="post">

                   <input type="text" name="tarefas" id="tarefas" class="input-vlr01"  maxlength="30" required placeholder="Tarefa">

                   <input type="text" name="responsavel" id="responsavel" class="input-vlr01"  maxlength="30" required placeholder="Responsável">

                   <textarea name="descricao" id="descricao" class="input-vlr02" maxlength="300" required placeholder="Descrição"></textarea>

                   <p>Prioridade</p>
                   <div class="div-prioridade">
                      

                      <input type="radio" id="baixa" name="prioridade" value="baixa">
                      <label for="baixa">Baixa</label>

                      <input type="radio" id="media" name="prioridade" value="media">
                      <label for="media">Média</label>

                      <input type="radio" id="alta" name="prioridade" value="alta">
                      <label for="alta">Alta</label>
                   </div>

                    <label for="datatarefa">Data Tarefa</label>
                    <input type="date" name="datatarefa" id="datatarefa" class="input-vlr04" required>
                    
                   
                   <div id="div-btns">
                      <button type="submit" id="btn-adicionar">Adicionar Tarefa</button>
                      <button type="reset" id="btn-limpar">Limpar</button>
                   </div>

                </form>

            </div>
        </section>

    </main> 
</body>
</html>
